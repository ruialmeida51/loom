name: Loom CI
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: loom-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/audit_project.py
      - name: Validate release tooling and legal pages
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          node --test tools/tests/*.mjs
          python3 tools/build_legal_site.py
          python3 tools/check_legal_site.py
      - name: Configure Android Firebase
        env:
          LOOM_FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$LOOM_FIREBASE_CONFIG" ]; then
            printf '%s' "$LOOM_FIREBASE_CONFIG" > androidApp/google-services.json
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:di:jvmTest :shared:features:analytics:jvmTest :shared:core:jvmTest :shared:features:authentication:jvmTest :shared:features:settings:jvmTest :shared:features:account:jvmTest :shared:features:home:jvmTest :shared:features:household:jvmTest :shared:features:shopping:jvmTest :shared:features:expenses:jvmTest :shared:features:feed:jvmTest :shared:features:insights:jvmTest :shared:features:reminders:jvmTest :shared:entrypoint:jvmTest :androidApp:assembleDebug
      - run: python3 tools/test_database.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno task check && deno task test
        working-directory: supabase/functions
      - uses: actions/upload-artifact@v4
        with:
          name: loom-debug
          path: androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loom-validation
          path: |
            shared/**/build/reports/tests/
            build/screenshots/
  android-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check Android keyboard, system Back and resume
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: ./gradlew :androidApp:connectedDebugAndroidTest --no-parallel --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'
      - name: Collect Android captures and logs
        if: always()
        run: |
          mkdir -p build/device-captures
          adb pull /sdcard/Android/data/com.eyther.lumbridge/files/usability build/device-captures || true
          adb logcat -d > build/device-captures/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loom-android-usability
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
            build/device-captures/
  ios:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:entrypoint:compileKotlinIosSimulatorArm64
      - run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme Loom -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
