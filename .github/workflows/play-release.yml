name: Android release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - docs/**
      - legal-site/**
      - config/loom-legal.properties
      - tools/build_legal_site.py
      - tools/check_legal_site.py
  workflow_dispatch:
    inputs:
      destination:
        description: Firebase, Play internal draft (with GitHub release/tag), or connection check
        type: choice
        options: [firebase, play, check]
        default: firebase
        required: true
      version_code:
        description: Optional Android version code override; normally leave empty
        type: string
        required: false
      tester_groups:
        description: Optional Firebase group aliases, comma-separated; defaults to distribution/firebase-groups.txt
        type: string
        required: false

# Both destinations share one queue and one version history.
concurrency:
  group: loom-android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main' || inputs.destination == 'check'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    environment: ${{ inputs.destination == 'play' && 'play-internal' || 'firebase-distribution' }}
    env:
      LOOM_DESTINATION: ${{ inputs.destination || 'firebase' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare signing and distribution credentials
        env:
          LOOM_VERSION_CODE: ${{ inputs.version_code }}
          LOOM_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          LOOM_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          LOOM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          LOOM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          LOOM_FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
          LOOM_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 tools/prepare_release.py
      - name: Allocate the next version across Firebase and Play
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LOOM_REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
        run: node tools/plan_release.mjs "$RUNNER_TEMP/loom-play-service-account.json" "$RUNNER_TEMP/loom-release-config.json"
      - uses: actions/setup-java@v4
        if: env.LOOM_DESTINATION != 'check'
        with:
          distribution: temurin
          java-version: '23'
      - uses: android-actions/setup-android@v3
        if: env.LOOM_DESTINATION != 'check'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
        if: env.LOOM_DESTINATION != 'check'
      - uses: gradle/actions/setup-gradle@v4
        if: env.LOOM_DESTINATION != 'check'
      - run: python3 tools/audit_project.py
      - name: Validate release tooling
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          node --test tools/tests/*.mjs
      - name: Test the shared app before packaging
        if: env.LOOM_DESTINATION != 'check'
        run: >-
          ./gradlew :shared:di:jvmTest :shared:features:analytics:jvmTest :shared:core:jvmTest :shared:features:authentication:jvmTest
          :shared:features:household:jvmTest :shared:features:shopping:jvmTest :shared:features:expenses:jvmTest
          :shared:features:feed:jvmTest :shared:features:insights:jvmTest :shared:features:reminders:jvmTest
          :shared:features:settings:jvmTest :shared:entrypoint:jvmTest
      - name: Build the signed APK and bundle
        if: env.LOOM_DESTINATION != 'check'
        env:
          LOOM_UPLOAD_STORE_FILE: ${{ runner.temp }}/loom-upload.jks
          LOOM_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          LOOM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          LOOM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          LOOM_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
          LOOM_VERSION_NAME: ${{ steps.plan.outputs.version_name }}
        run: >-
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --no-parallel
          -PloomVersionCode="$LOOM_VERSION_CODE" -PloomVersionName="$LOOM_VERSION_NAME"
      - name: Upload to Firebase App Distribution
        if: env.LOOM_DESTINATION == 'firebase'
        env:
          LOOM_FIREBASE_GROUPS: ${{ inputs.tester_groups }}
        run: >-
          node tools/publish_firebase.mjs "$RUNNER_TEMP/loom-play-service-account.json"
          "$RUNNER_TEMP/loom-release-config.json" androidApp/build/outputs/apk/release/androidApp-release.apk
          distribution/whatsnew/whatsnew-en-US
      - name: Verify public legal pages
        if: env.LOOM_DESTINATION == 'play'
        run: python3 tools/check_legal_site.py --live
      - name: Upload Play internal draft
        if: env.LOOM_DESTINATION == 'play'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJson: ${{ runner.temp }}/loom-play-service-account.json
          packageName: com.eyther.lumbridge
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          tracks: internal
          status: draft
          releaseName: ${{ steps.plan.outputs.version_name }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
      - name: Record the successful release version
        if: env.LOOM_DESTINATION != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/record_release.mjs
      - name: Create GitHub release and tag for Play
        if: env.LOOM_DESTINATION == 'play'
        env:
          GH_TOKEN: ${{ github.token }}
          LOOM_VERSION_NAME: ${{ steps.plan.outputs.version_name }}
          LOOM_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['LOOM_VERSION_NAME']
          code = os.environ['LOOM_VERSION_CODE']
          notes = Path('distribution/whatsnew/whatsnew-en-US').read_text()
          body = f'Loom {version} ({code})\n\nUploaded to Google Play as an **internal testing draft**.\n\n{notes}\nSource: `{os.environ["GITHUB_SHA"]}`\n'
          (Path(os.environ['RUNNER_TEMP']) / 'loom-github-release.md').write_text(body)
          PY
          gh release create "v$LOOM_VERSION_NAME" --target "$GITHUB_SHA" --title "Loom $LOOM_VERSION_NAME" --notes-file "$RUNNER_TEMP/loom-github-release.md" --prerelease androidApp/build/outputs/bundle/release/*.aab
      - name: Save Play bundle and mapping
        if: env.LOOM_DESTINATION == 'play'
        uses: actions/upload-artifact@v4
        with:
          name: loom-play-${{ steps.plan.outputs.version_code }}
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/loom-upload.jks" "$RUNNER_TEMP/loom-play-service-account.json" androidApp/google-services.json
