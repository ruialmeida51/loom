name: Legal pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - legal-site/**
      - config/loom-legal.properties
      - tools/build_legal_site.py
      - tools/check_legal_site.py
      - .github/workflows/legal-pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: loom-legal-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_legal_site.py
      - run: python3 tools/check_legal_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal-site/dist
      - uses: actions/deploy-pages@v4
        id: deployment
