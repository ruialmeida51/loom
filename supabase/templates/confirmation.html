<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Verify your Loom email</title></head>
  <body style="font-family: sans-serif; color: #26251f; background: #faf8f2; padding: 32px;">
    <h1>Welcome to Loom</h1>
    <p>Enter this verification code in the Loom app:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
    <p>If you didn’t create a Loom account, you can ignore this email.</p>
    <p>Need help? Contact eytherdeveloper@gmail.com.</p>
  </body>
</html>
